<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<script>
(function () {
  var light = { paper: '#f2f4f8', mint: '#eef6f2', sand: '#f7f2ea', lavender: '#f4f1fb' };
  var dark = { black: '#0d0d0f', midnight: '#0a1020', forest: '#0b130f', graphite: '#121110', comet: '#0f0708' };
  var id = 'black';
  try { id = localStorage.getItem('kintore-theme') || 'black'; } catch (e) {}
  if (!light[id] && !dark[id]) id = 'black';
  document.documentElement.setAttribute('data-theme', id);
  document.documentElement.setAttribute('data-tone', light[id] ? 'light' : 'dark');
  window.__themeBoot = { id: id, light: !!light[id], color: light[id] || dark[id] };
})();
</script>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="筋トレ">
<meta name="theme-color" content="#0d0d0f" id="meta-theme">
<script>
(function () {
  var b = window.__themeBoot; if (!b) return;
  var sb = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
  if (sb) sb.setAttribute('content', b.light ? 'default' : 'black');
  var tc = document.getElementById('meta-theme');
  if (tc) tc.setAttribute('content', b.color);
})();
</script>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
<title>筋トレ</title>
</head>
<body>
<div id="app">
  <main id="view"></main>
  <nav id="tabs">
    <button data-act="tab" data-t="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg><span>ホーム</span></button>
    <button data-act="tab" data-t="body"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7v10M4 9.5v5M17 7v10M20 9.5v5M7 12h10"/></svg><span>部位</span></button>
    <button data-act="tab" data-t="menu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M5 12h14M5 17h9"/></svg><span>メニュー</span></button>
    <button data-act="tab" data-t="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3v3m0 12v3M3 12h3m12 0h3M5.6 5.6l2.1 2.1m8.6 8.6l2.1 2.1m0-12.8l-2.1 2.1M7.7 16.3l-2.1 2.1"/></svg><span>設定</span></button>
  </nav>
</div>
<div id="sheet-root"></div>
<div id="timer" hidden>
  <svg viewBox="0 0 300 300" aria-hidden="true">
    <circle class="ring-bg" cx="150" cy="150" r="130"/>
    <circle class="ring-fg" id="ring-fg" cx="150" cy="150" r="130"/>
    <circle class="ring-press" id="ring-press" cx="150" cy="150" r="112"/>
  </svg>
  <div id="timer-num">0:00</div>
  <div id="timer-hint"></div>
</div>
<input type="file" id="file" accept=".json,application/json" hidden>
<script src="logic.js"></script>
<script src="db.js"></script>
<script src="presets.js"></script>
<script src="app.js"></script>
<script src="figure.js"></script>
<script src="drag.js"></script>
<script src="timer.js"></script>
</body>
</html>
